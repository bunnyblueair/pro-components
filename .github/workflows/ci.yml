name: Publish Preview

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Build workspace
        run: yarn build:pro

      - name: Publish preview packages
        run: npx pkg-pr-new publish --yarn './packages/*' --packageManager pnpm,npm,yarn